<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>티어표 만들기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; padding: 12px; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 12px; }
    
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 15px; }
    .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; }
    #file-input { display: none; }

    #tier-board { background: #000; border: 1px solid #444; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
    .tier-row { display: flex; min-height: 80px; background: #222; }
    .tier-label { width: 70px; min-width: 70px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; color: #000; text-align: center; }
    .tier-items { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; background: #1a1a1a; min-height: 80px; align-content: flex-start; }

    .item-card { width: 65px; height: 65px; border-radius: 4px; overflow: hidden; background: #333; position: relative; cursor: pointer; border: 1px solid #555; }
    .item-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

    #unranked-section { margin-top: 15px; background: #222; padding: 10px; border-radius: 6px; border: 1px solid #444; }
    #unranked-section h3 { font-size: 0.9rem; margin-bottom: 8px; color: #aaa; }
    #unranked-pool { min-height: 90px; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; background: #141414; border-radius: 4px; border: 1px dashed #555; }

    /* 모달 */
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:9999; }
    .modal-overlay.active { display:flex; }
    .modal-box { background:#2a2a2a; padding:15px; border-radius:10px; width:85%; max-width:300px; text-align:center; }
    .modal-box h3 { margin-bottom:12px; font-size:1rem; }
    .tier-btns { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
    .t-btn { padding:10px; border:none; border-radius:4px; font-weight:bold; font-size:1rem; color:#000; }
    .preview-img { width:100%; max-height:60vh; object-fit:contain; margin-bottom:10px; }
  </style>
</head>
<body>

  <h1>🏆 티어표 생성기</h1>

  <div class="toolbar">
    <label class="btn btn-primary" for="file-input">📷 이미지 추가</label>
    <input type="file" id="file-input" multiple accept="image/*">
    <button class="btn" onclick="saveAsImage()">💾 이미지 저장</button>
  </div>

  <div id="tier-board">
    <div class="tier-row"><div class="tier-label" style="background:#ff7f7f;">S</div><div class="tier-items" id="tier-S"></div></div>
    <div class="tier-row"><div class="tier-label" style="background:#ffbf7f;">A</div><div class="tier-items" id="tier-A"></div></div>
    <div class="tier-row"><div class="tier-label" style="background:#ffff7f;">B</div><div class="tier-items" id="tier-B"></div></div>
    <div class="tier-row"><div class="tier-label" style="background:#7fff7f;">C</div><div class="tier-items" id="tier-C"></div></div>
    <div class="tier-row"><div class="tier-label" style="background:#7fbfff;">D</div><div class="tier-items" id="tier-D"></div></div>
    <div class="tier-row"><div class="tier-label" style="background:#bf7fff;">F</div><div class="tier-items" id="tier-F"></div></div>
  </div>

  <div id="unranked-section">
    <h3>📦 미분류 목록 (클릭하여 이동)</h3>
    <div id="unranked-pool" class="tier-items"></div>
  </div>

  <!-- 이동 모달 -->
  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <h3>이동할 등급 선택</h3>
      <div class="tier-btns">
        <button class="t-btn" style="background:#ff7f7f;" onclick="moveTo('S')">S</button>
        <button class="t-btn" style="background:#ffbf7f;" onclick="moveTo('A')">A</button>
        <button class="t-btn" style="background:#ffff7f;" onclick="moveTo('B')">B</button>
        <button class="t-btn" style="background:#7fff7f;" onclick="moveTo('C')">C</button>
        <button class="t-btn" style="background:#7fbfff;" onclick="moveTo('D')">D</button>
        <button class="t-btn" style="background:#bf7fff;" onclick="moveTo('F')">F</button>
      </div>
      <button class="btn" style="width:100%; background:#444;" onclick="moveTo('unranked')">미분류로 이동</button>
      <button class="btn" style="width:100%; margin-top:6px; background:#222;" onclick="closeModal('move-modal')">취소</button>
    </div>
  </div>

  <!-- 이미지 결과 모달 -->
  <div class="modal-overlay" id="img-modal">
    <div class="modal-box">
      <h3>티어표 완성!</h3>
      <p style="font-size:0.8rem; color:#aaa; margin-bottom:8px;">이미지를 길게 눌러 사진 앱에 저장하세요.</p>
      <img id="result-img" class="preview-img">
      <button class="btn" style="width:100%;" onclick="closeModal('img-modal')">닫기</button>
    </div>
  </div>

  <script>
    let selectedItem = null;

    document.getElementById('file-input').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const card = document.createElement('div');
          card.className = 'item-card';
          const img = document.createElement('img');
          img.src = evt.target.result;
          card.appendChild(img);

          card.addEventListener('click', function() {
            selectedItem = card;
            document.getElementById('move-modal').classList.add('active');
          });

          document.getElementById('unranked-pool').appendChild(card);
        };
        reader.readAsDataURL(file);
      });
      this.value = '';
    });

    function moveTo(tier) {
      if (!selectedItem) return;
      if (tier === 'unranked') {
        document.getElementById('unranked-pool').appendChild(selectedItem);
      } else {
        document.getElementById('tier-' + tier).appendChild(selectedItem);
      }
      closeModal('move-modal');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      selectedItem = null;
    }

    function saveAsImage() {
      const board = document.getElementById('tier-board');
      html2canvas(board, { backgroundColor: '#000000' }).then(canvas => {
        const dataUrl = canvas.toDataURL('image/png');
        document.getElementById('result-img').src = dataUrl;
        document.getElementById('img-modal').classList.add('active');
      });
    }
  </script>
</body>
</html>
