<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>티어표 생성기 Pro</title>
  <style>
    :root {
      --bg: #121316;
      --panel: #1e2025;
      --border: #2e323b;
      --text: #f0f2f5;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    /* iOS Safari는 user-select:none인 입력칸에 타이핑이 안 되므로 예외 처리 */
    input[type="text"], select {
      user-select: text; -webkit-user-select: text;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(120px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 900px; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 4px; font-weight: 800; }
    .hint { text-align: center; font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }

    /* Controls */
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      background: #2b2e36;
      color: #fff;
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
      text-align: center;
    }
    .btn:active { transform: scale(0.97); filter: brightness(1.15); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; border-color: #60a5fa; }
    .btn-success { background: #10b981; border-color: #34d399; }
    .btn-sheet { background: #0f9d58; border-color: #34d399; }
    .btn-accent {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-color: #c4b5fd;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);
    }
    .btn-danger { background: transparent; color: #f87171; border-color: #7f1d1d; }
    .btn-wide { grid-column: 1 / -1; }
    .btn-small { min-height: 38px; }
    #file-input, #backup-input, #table-input { display: none; }

    /* 단어 입력줄 */
    .word-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #word-input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 12px;
      font-size: 16px; /* iOS 확대 방지 */
      outline: none;
    }
    #word-input:focus { border-color: #60a5fa; }
    #word-add { white-space: nowrap; padding: 9px 16px; }

    /* Tier Table */
    #tier-board {
      background: #0d0e10;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .tier-row { display: flex; min-height: 80px; background: #181a1f; }
    .tier-label {
      width: 75px;
      min-width: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.4rem;
      color: #000;
      text-align: center;
    }

    .tier-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: #141518;
      min-height: 80px;
      align-content: flex-start;
      transition: background 0.15s;
    }
    .tier-items.drop-hover {
      background: #1a2436;
      outline: 2px dashed #60a5fa;
      outline-offset: -3px;
    }

    /* 카드 (이미지: 1:1 정사각형, 비율 유지) */
    .item-card {
      width: 68px;
      height: 68px;
      flex: 0 0 68px;
      border-radius: 6px;
      background: #000;
      position: relative;
      border: 1px solid rgba(255,255,255,0.15);
      touch-action: none;
      overflow: hidden;
      cursor: grab;
    }
    .item-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* 카드 (단어) : 높이는 동일, 폭은 글자 수에 맞춰 자동 */
    .item-card.text-card {
      width: auto;
      min-width: 68px;
      max-width: 140px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 5px;
      background: #2a2e38;
      border-color: rgba(255,255,255,0.2);
    }
    .item-card.text-card .txt {
      color: #f0f2f5;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      word-break: keep-all;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .item-card.drag-origin { opacity: 0.3; }
    .item-card.ghost {
      position: fixed;
      z-index: 10000;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.12);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      opacity: 0.95;
      cursor: grabbing;
    }

    /* Unranked Pool */
    #unranked-section {
      margin-top: 16px;
      background: var(--panel);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    #unranked-section h3 {
      font-size: 0.9rem; margin-bottom: 8px; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .count {
      background: #2b2e36; color: #d1d5db; border-radius: 999px;
      padding: 1px 8px; font-size: 0.75rem;
    }
    #unranked-pool {
      min-height: 90px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: #121316;
      border-radius: 8px;
      border: 2px dashed #2e323b;
      align-content: flex-start;
    }
    #unranked-pool.drop-hover { border-color: #60a5fa; }
    #unranked-pool:empty::before {
      content: "이미지를 올리거나 단어를 입력하면 여기에 쌓여요";
      width: 100%;
      align-self: center;
      text-align: center;
      font-size: 0.8rem;
      color: #4b5563;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #23262d;
      padding: 18px;
      border-radius: 14px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      border: 1px solid #3f4452;
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .modal-thumb {
      width: 96px; height: 96px; object-fit: contain;
      background: #000; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      margin: 0 auto 12px; display: block;
    }
    #move-text {
      display: none;
      min-height: 52px;
      margin: 0 auto 12px;
      padding: 10px;
      border-radius: 8px;
      background: #2a2e38;
      border: 1px solid rgba(255,255,255,0.2);
      font-weight: 700;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }
    .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .t-btn {
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      color: #000;
      cursor: pointer;
    }
    .t-btn:active { transform: scale(0.95); }
    .modal-box .btn { width: 100%; margin-top: 6px; }

    .preview-img {
      width: 100%; max-height: 60vh; object-fit: contain;
      border-radius: 8px; margin-bottom: 10px; background: #000;
      -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
    }

    /* 단어 가져오기 모달 */
    #import-modal .modal-box { max-width: 380px; }
    #import-modal select {
      width: 100%;
      background: #181a1f; color: #fff;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; font-size: 16px; margin-bottom: 6px;
    }
    .opt {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.85rem; text-align: left;
      padding: 6px 2px; color: #d1d5db;
    }
    .opt input { width: 18px; height: 18px; accent-color: #3b82f6; }
    #import-count { margin: 8px 0 6px; font-size: 0.85rem; color: #d1d5db; }
    #import-preview {
      max-height: 150px; overflow-y: auto; text-align: left;
      background: #181a1f; border-radius: 8px; padding: 6px; margin-bottom: 8px;
    }
    .chip {
      display: inline-block;
      background: #2a2e38; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px; padding: 3px 7px; margin: 2px;
      font-size: 0.75rem; font-weight: 700;
    }
    .chip.more { background: transparent; border-style: dashed; color: var(--muted); }

    /* Toast */
    #toast {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -20px);
      background: #2b2e36;
      border: 1px solid #3f4452;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100000;
      max-width: 92%;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 티어표 생성기 Pro</h1>
    <p class="hint">이미지·단어를 탭하면 등급 선택 · 드래그하면 이동/순서 변경<br>새로고침하면 모두 초기화돼요 (보관은 💾 백업 저장)</p>

    <div class="toolbar">
      <label class="btn btn-primary" for="file-input">📷 이미지 업로드</label>
      <input type="file" id="file-input" multiple accept="image/*">

      <label class="btn btn-sheet" for="table-input">📊 엑셀/CSV 업로드</label>
      <input type="file" id="table-input" accept=".xlsx,.xls,.xlsm,.csv,.tsv,.txt">

      <button class="btn btn-success" onclick="exportBackup()">💾 백업 저장</button>
      <label class="btn" for="backup-input">📂 백업 불러오기</label>
      <input type="file" id="backup-input" accept=".json">

      <button id="download-btn" class="btn btn-accent btn-wide" onclick="saveAsImage()">🖼️ 이미지 다운로드</button>
      <button class="btn btn-danger btn-wide btn-small" onclick="clearData()">🔄 전체 초기화</button>
    </div>

    <!-- 단어 입력 -->
    <div class="word-bar">
      <input type="text" id="word-input" placeholder="단어 입력 · 엑셀 셀 복사 후 붙여넣기" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="btn btn-primary" id="word-add">➕ 추가</button>
    </div>

    <!-- Tier Board -->
    <div id="tier-board">
      <div class="tier-row"><div class="tier-label" style="background: #ff7f7f;">S</div><div class="tier-items" id="tier-S" data-tier="S"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #ffbf7f;">A</div><div class="tier-items" id="tier-A" data-tier="A"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #ffff7f;">B</div><div class="tier-items" id="tier-B" data-tier="B"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #7fff7f;">C</div><div class="tier-items" id="tier-C" data-tier="C"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #7fbfff;">D</div><div class="tier-items" id="tier-D" data-tier="D"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #bf7fff;">F</div><div class="tier-items" id="tier-F" data-tier="F"></div></div>
    </div>

    <!-- Unranked Pool -->
    <div id="unranked-section">
      <h3>📦 미분류 보관함 <span class="count" id="pool-count">0</span></h3>
      <div id="unranked-pool" data-tier="unranked"></div>
    </div>
  </div>

  <!-- Quick Move Modal -->
  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <h3>배치할 등급 선택</h3>
      <img id="move-thumb" class="modal-thumb" alt="">
      <div id="move-text"></div>
      <div class="tier-grid">
        <button class="t-btn" style="background:#ff7f7f;" onclick="moveTo('S')">S</button>
        <button class="t-btn" style="background:#ffbf7f;" onclick="moveTo('A')">A</button>
        <button class="t-btn" style="background:#ffff7f;" onclick="moveTo('B')">B</button>
        <button class="t-btn" style="background:#7fff7f;" onclick="moveTo('C')">C</button>
        <button class="t-btn" style="background:#7fbfff;" onclick="moveTo('D')">D</button>
        <button class="t-btn" style="background:#bf7fff;" onclick="moveTo('F')">F</button>
      </div>
      <button class="btn" style="background:#333;" onclick="moveTo('unranked')">미분류로 이동</button>
      <button class="btn" id="move-edit" style="display:none;" onclick="editSelected()">✏️ 텍스트 수정</button>
      <button class="btn btn-danger" onclick="deleteSelected()">🗑️ 삭제</button>
      <button class="btn" style="background:#181818;" onclick="closeModal('move-modal')">취소</button>
    </div>
  </div>

  <!-- 단어 가져오기 모달 (붙여넣기 / 엑셀·CSV) -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal-box">
      <h3>📋 단어 가져오기</h3>
      <div id="import-sheet-wrap" style="display:none;">
        <select id="import-sheet"></select>
      </div>
      <label class="opt"><input type="checkbox" id="opt-header"> 첫 줄(제목)은 제외</label>
      <label class="opt"><input type="checkbox" id="opt-dedupe" checked> 중복 단어 제거 (이미 있는 단어 포함)</label>
      <p id="import-count"></p>
      <div id="import-preview"></div>
      <button class="btn btn-primary" id="import-confirm" onclick="confirmImport()">미분류에 추가</button>
      <button class="btn" style="background:#181818;" onclick="closeModal('import-modal')">취소</button>
    </div>
  </div>

  <!-- Preview Modal (공유창이 열리지 않을 때의 대체 저장 방법) -->
  <div class="modal-overlay" id="preview-modal">
    <div class="modal-box">
      <h3>이미지를 길게 눌러 저장하세요</h3>
      <img id="preview-img" class="preview-img" alt="티어표 미리보기">
      <button class="btn" onclick="closePreview()">닫기</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const POOL_ID = 'unranked-pool';
    const MAX_IMPORT = 500;

    let selectedItem = null;
    let drag = null;
    let toastTimer = null;
    let previewUrl = null;
    let importState = null;

    /* 새로고침 = 초기화 : 예전 버전이 남겨둔 저장 데이터는 정리 */
    (function purgeOldStorage() {
      try { localStorage.removeItem('tierlist_autosave'); localStorage.removeItem('tierlist_state'); } catch (e) {}
      try { if (window.indexedDB) indexedDB.deleteDatabase('tierlist-pro'); } catch (e) {}
    })();

    /* ==PURE-START== (화면과 무관한 텍스트 처리 함수들) */
    const MAX_TEXT = 60;

    function normalizeText(v) {
      return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, MAX_TEXT);
    }

    // 구분자 기반 표 파서 (따옴표/줄바꿈 처리)
    function parseDelimited(text, delim, quotes) {
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i++; }
            else inQ = false;
          } else cell += ch;
        } else if (quotes && ch === '"' && cell === '') {
          inQ = true;
        } else if (ch === delim) {
          row.push(cell); cell = '';
        } else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); rows.push(row); row = []; cell = '';
        } else {
          cell += ch;
        }
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    // 스프레드시트에서 복사한 텍스트(탭 구분) 또는 일반 줄바꿈 텍스트
    function parsePastedText(text) {
      text = String(text).replace(/\r\n?/g, '\n').replace(/^\n+|\n+$/g, '');
      if (!text) return [];
      if (text.indexOf('\t') >= 0) return parseDelimited(text, '\t', true);
      return text.split('\n').map(l => [l]);
    }

    function detectDelimiter(text) {
      const first = text.split(/\r?\n/).find(l => l.trim()) || '';
      const c = { ',': 0, ';': 0, '\t': 0 };
      let q = false;
      for (const ch of first) {
        if (ch === '"') q = !q;
        else if (!q && Object.prototype.hasOwnProperty.call(c, ch)) c[ch]++;
      }
      let best = ',', n = 0;
      for (const k of Object.keys(c)) { if (c[k] > n) { best = k; n = c[k]; } }
      return best;
    }

    // UTF-8 / UTF-16 / EUC-KR(엑셀 CSV 기본) 자동 판별
    function decodeText(buf) {
      let bytes = new Uint8Array(buf);
      if (bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) bytes = bytes.subarray(3);
      else if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes.subarray(2));
      else if (bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(bytes.subarray(2));
      try {
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (e) {
        try { return new TextDecoder('euc-kr').decode(bytes); }
        catch (_) { return new TextDecoder().decode(bytes); }
      }
    }

    // 표(2차원 배열) → 단어 목록 (왼쪽→오른쪽, 위→아래 순서)
    function rowsToItems(rows, skipHeader, dedupe, existing) {
      const out = [];
      const seen = new Set(existing || []);
      const list = skipHeader ? rows.slice(1) : rows;
      for (const row of list) {
        for (const cell of row) {
          const t = normalizeText(cell);
          if (!t) continue;
          if (dedupe) {
            if (seen.has(t)) continue;
            seen.add(t);
          }
          out.push(t);
        }
      }
      return out;
    }
    /* ==PURE-END== */

    /* ---------- 유틸 ---------- */
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function todayStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function containerFor(tier) {
      if (!tier || tier === 'unranked') return document.getElementById(POOL_ID);
      return document.getElementById('tier-' + tier) || document.getElementById(POOL_ID);
    }

    function allContainers() {
      return document.querySelectorAll('.tier-items, #' + POOL_ID);
    }

    function updateCounts() {
      document.getElementById('pool-count').textContent = document.getElementById(POOL_ID).children.length;
    }

    /* ---------- 이미지 업로드 (긴 변 1280px로 축소) ---------- */
    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => resolve({ img, url });
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없음')); };
        img.src = url;
      });
    }

    async function processFile(file) {
      const { img, url } = await loadImageFromFile(file);
      try {
        const MAX = 1280;
        const s = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * s));
        const h = Math.max(1, Math.round(img.naturalHeight * s));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.fillStyle = '#000';
        x.fillRect(0, 0, w, h);
        x.imageSmoothingEnabled = true;
        x.imageSmoothingQuality = 'high';
        x.drawImage(img, 0, 0, w, h);
        return c.toDataURL('image/jpeg', 0.92);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    document.getElementById('file-input').addEventListener('change', async function (e) {
      const files = Array.from(e.target.files || []);
      this.value = '';
      if (!files.length) return;

      toast('이미지 처리 중... (' + files.length + '장)');
      const pool = document.getElementById(POOL_ID);
      let ok = 0, fail = 0;
      for (const file of files) {
        try {
          const src = await processFile(file);
          createItemCard(src, pool);
          ok++;
        } catch (err) {
          console.error(err);
          fail++;
        }
      }
      updateCounts();
      toast(fail ? ok + '장 추가, ' + fail + '장 실패' : ok + '장 추가됨');
    });

    /* ---------- 카드 만들기 ---------- */
    function bindCard(card) {
      card.addEventListener('pointerdown', onPointerDown);
      card.addEventListener('contextmenu', e => e.preventDefault());
    }

    function createItemCard(src, parent) {
      const card = document.createElement('div');
      card.className = 'item-card';

      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.draggable = false;
      card.appendChild(img);

      bindCard(card);
      if (parent) parent.appendChild(card);
      return card;
    }

    function textFontSize(text) {
      const n = Array.from(text).length;
      return n <= 2 ? 20 : n <= 4 ? 16 : n <= 8 ? 14 : n <= 14 ? 12 : n <= 30 ? 11 : 10;
    }

    function setCardText(card, text) {
      const span = card.querySelector('.txt');
      span.textContent = text;
      span.style.fontSize = textFontSize(text) + 'px';
    }

    function createTextCard(text, parent) {
      const card = document.createElement('div');
      card.className = 'item-card text-card';
      card.dataset.kind = 'text';

      const span = document.createElement('span');
      span.className = 'txt';
      card.appendChild(span);
      setCardText(card, text);

      bindCard(card);
      if (parent) parent.appendChild(card);
      return card;
    }

    /* ---------- 단어 입력 / 붙여넣기 ---------- */
    // 한 개면 바로 추가, 여러 개면 가져오기 창을 띄움
    function handleTextInput(text) {
      const rows = parsePastedText(text);
      const items = rowsToItems(rows, false, false);
      if (!items.length) return false;
      if (items.length === 1) {
        createTextCard(items[0], document.getElementById(POOL_ID));
        updateCounts();
        toast('단어 추가됨');
        return true;
      }
      openImport([{ name: '붙여넣기', rows }]);
      return true;
    }

    const wordInput = document.getElementById('word-input');

    function submitWord() {
      const v = wordInput.value;
      if (!v.trim()) return;
      if (handleTextInput(v)) wordInput.value = '';
    }

    wordInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        submitWord();
      }
    });
    document.getElementById('word-add').addEventListener('click', submitWord);

    // 입력칸 안에서든, 화면 어디서든(PC) 여러 셀을 붙여넣으면 처리
    document.addEventListener('paste', e => {
      const t = e.target;
      if (t && t.closest && t.closest('.modal-overlay')) return;
      const editable = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
      if (editable && t.id !== 'word-input') return;

      const cd = e.clipboardData || window.clipboardData;
      const text = cd ? cd.getData('text') : '';
      if (!text || !text.trim()) return;

      const multi = /[\t\r\n]/.test(text.trim());
      if (editable && !multi) return;   // 입력칸에 한 단어 붙여넣기는 기본 동작

      e.preventDefault();
      if (editable && wordInput.value.trim() === '') wordInput.value = '';
      handleTextInput(text);
    });

    /* ---------- 엑셀 / CSV 업로드 ---------- */
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('스크립트 로드 실패'));
        document.head.appendChild(s);
      });
    }

    let xlsxPromise = null;
    function ensureXLSX() {
      if (window.XLSX) return Promise.resolve();
      if (!xlsxPromise) {
        xlsxPromise = loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')
          .catch(err => { xlsxPromise = null; throw err; });
      }
      return xlsxPromise;
    }

    async function readTableFile(file) {
      const name = file.name.toLowerCase();
      const buf = await file.arrayBuffer();

      if (/\.(csv|tsv|txt)$/.test(name)) {
        const text = decodeText(buf);
        let rows;
        if (name.endsWith('.txt')) {
          rows = text.replace(/\r\n?/g, '\n').split('\n').map(l => [l]);
        } else {
          const delim = name.endsWith('.tsv') ? '\t' : detectDelimiter(text);
          rows = parseDelimited(text, delim, true);
        }
        return [{ name: file.name, rows }];
      }

      await ensureXLSX();
      const wb = XLSX.read(buf, { type: 'array' });
      return wb.SheetNames
        .map(n => ({
          name: n,
          rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' })
        }))
        .filter(s => s.rows.length);
    }

    document.getElementById('table-input').addEventListener('change', async function (e) {
      const file = e.target.files[0];
      this.value = '';

        const sheets = await readTableFile(file);
        if (!sheets.length || sheets.every(s => !rowsToItems(s.rows, false, false).length)) {

    /* ---------- 가져오기 모달 ---------- */
    function existingTexts() {

      document.querySelectorAll('.item-card.text-card:not(.ghost) .txt').forEach(el => s.add(el.textContent));

    function currentImportItems() {

        sheet.rows,

    function refreshImport() {
      if (!importState) return;
      const items = currentImportItems();
      const countEl = document.getElementById('import-count');
      countEl.textContent = items.length > MAX_IMPORT
        ? items.length + '개 인식됨 (처음 ' + MAX_IMPORT + '개만 추가돼요)'
        : items.length + '개 인식됨';

    function openImport(sheets) {

    function confirmImport() {

      const over = items.length > MAX_IMPORT;

      items.forEach(t => createTextCard(t, pool));

    /* ---------- 드래그 (터치/마우스 공통, 놓은 위치에 끼워넣기) ---------- */
    function onPointerDown(e) {
      if (drag) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      drag = {
        card: e.currentTarget,
        id: e.pointerId,
        sx: e.clientX, sy: e.clientY,
        moved: false, ghost: null, hover: null
      };
      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerCancel);
    }

    function startDrag() {
      drag.moved = true;
      const g = drag.card.cloneNode(true);
      g.classList.add('ghost');
      g.style.width = drag.card.getBoundingClientRect().width + 'px';
      document.body.appendChild(g);
      drag.ghost = g;
      drag.card.classList.add('drag-origin');
    }

    function onPointerMove(e) {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved) {
        if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
        startDrag();
      }
      e.preventDefault();
      drag.ghost.style.left = e.clientX + 'px';
      drag.ghost.style.top = e.clientY + 'px';
      const loc = locate(e.clientX, e.clientY);
      setHover(loc ? loc.container : null);
    }

    function locate(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;

      let container = el.closest('.tier-items');
      if (!container) {
        const row = el.closest('.tier-row');
        if (row) container = row.querySelector('.tier-items');
      }
      if (!container && el.closest('#unranked-section')) {
        container = document.getElementById(POOL_ID);
      }
      if (!container) return null;

      let ref = null;       // 이 노드 앞에 삽입 (null이면 맨 뒤)
      let self = false;
      const target = el.closest('.item-card');
      if (target === drag.card) {
        self = true;
      } else if (target && target.parentElement === container) {
        const r = target.getBoundingClientRect();
        ref = x < r.left + r.width / 2 ? target : target.nextElementSibling;
      }
      return { container, ref, self };
    }

    function setHover(container) {
      if (drag.hover === container) return;
      if (drag.hover) drag.hover.classList.remove('drop-hover');
      if (container) container.classList.add('drop-hover');
      drag.hover = container;
    }

    function onPointerUp(e) {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      if (d.moved) {
        const loc = locate(e.clientX, e.clientY);
        cleanupDrag();
        if (loc && !loc.self) {
          loc.container.insertBefore(d.card, loc.ref || null);
          updateCounts();
        }
      } else {
        cleanupDrag();
        openMoveModal(d.card);
      }
    }

    function onPointerCancel() {
      if (drag) cleanupDrag();
    }

    function cleanupDrag() {
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerCancel);
      if (drag.ghost) drag.ghost.remove();
      drag.card.classList.remove('drag-origin');
      if (drag.hover) drag.hover.classList.remove('drop-hover');
      drag = null;
    }

    /* ---------- 등급 선택 모달 ---------- */
    function openMoveModal(card) {

      const isText = card.dataset.kind === 'text';
      const thumb = document.getElementById('move-thumb');
      const tbox = document.getElementById('move-text');
      const editBtn = document.getElementById('move-edit');

      if (isText) {
        thumb.style.display = 'none';
        thumb.removeAttribute('src');
        tbox.style.display = 'flex';
        tbox.textContent = card.querySelector('.txt').textContent;
        editBtn.style.display = 'flex';
      } else {
        const img = card.querySelector('img');
        thumb.style.display = 'block';
        thumb.src = img ? img.src : '';
        tbox.style.display = 'none';
        editBtn.style.display = 'none';
      }
      document.getElementById('move-modal').classList.add('active');

    function moveTo(tier) {

    function editSelected() {
      if (!selectedItem || selectedItem.dataset.kind !== 'text') return;
      const cur = selectedItem.querySelector('.txt').textContent;

      if (v === null) return;
      const t = normalizeText(v);

      setCardText(selectedItem, t);

    function deleteSelected() {

    /* ---------- 백업 / 초기화 (자동 저장 없음: 새로고침하면 초기화) ---------- */
    function collectData() {
      const items = [];
      document.querySelectorAll('.item-card:not(.ghost)').forEach(card => {
        const parent = card.parentElement;
        if (!parent) return;
        const tier = parent.getAttribute('data-tier') || 'unranked';
        if (card.dataset.kind === 'text') {
          items.push({ tier, text: card.querySelector('.txt').textContent });
        } else {
          const img = card.querySelector('img');
          if (img && img.src) items.push({ tier, imgSrc: img.src });
        }
      });
      return items;
    }

    function restoreData(data) {
      if (!Array.isArray(data)) return;
      allContainers().forEach(el => el.innerHTML = '');
      data.forEach(item => {
        if (!item) return;
        const parent = containerFor(item.tier);
        if (typeof item.text === 'string') {
          const t = normalizeText(item.text);
          if (t) createTextCard(t, parent);
        } else if (typeof item.imgSrc === 'string') {
          createItemCard(item.imgSrc, parent);
        }
      });
      updateCounts();
    }

    function exportBackup() {
      const data = collectData();
      if (data.length === 0) { toast('백업할 아이템이 없습니다.'); return; }
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      downloadBlob(blob, 'tierlist-backup-' + todayStr() + '.json');
    }

    document.getElementById('backup-input').addEventListener('change', function (e) {
      const file = e.target.files[0];
      this.value = '';
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (evt) {
        let parsed = null;
        try { parsed = JSON.parse(evt.target.result); }
        catch (err) { toast('올바른 백업 파일(.json)이 아닙니다.'); return; }

        if (!Array.isArray(parsed)) { toast('지원하지 않는 백업 형식입니다.'); return; }

        if (collectData().length > 0 && !confirm('현재 내용이 백업 내용으로 대체됩니다. 계속할까요?')) return;

        restoreData(parsed);
        toast('백업을 불러왔어요 (' + parsed.length + '개)');
      };
      reader.readAsText(file);
    });

    function clearData() {
      if (!confirm('모든 내용을 초기화하시겠습니까?')) return;
      allContainers().forEach(el => el.innerHTML = '');
      updateCounts();
      toast('초기화되었습니다.');
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }

    /* ---------- 🖼️ 고화질 이미지 저장 (캔버스 직접 렌더링) ---------- */
    function roundRect(ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 큰 원본을 한 번에 줄이면 모바일 Safari에서 계단/깨짐이 생기므로 절반씩 단계적으로 축소
    function prescale(img, targetW, targetH) {
      let cw = img.naturalWidth, ch = img.naturalHeight;
      let src = img;
      while (cw / 2 >= targetW && ch / 2 >= targetH) {
        const nw = Math.floor(cw / 2), nh = Math.floor(ch / 2);
        const c = document.createElement('canvas');
        c.width = nw; c.height = nh;
        const x = c.getContext('2d');
        x.imageSmoothingEnabled = true;
        x.imageSmoothingQuality = 'high';
        x.drawImage(src, 0, 0, nw, nh);
        src = c; cw = nw; ch = nh;
      }
      return src;
    }

    // 화면에서 실제로 줄바꿈된 모양 그대로 텍스트 줄 정보를 읽어옴
    function getTextLines(el) {
      const node = el.firstChild;
      if (!node || node.nodeType !== 3) return [];
      const s = node.data;
      const range = document.createRange();
      const lines = [];
      let cur = null;
      for (let i = 0; i < s.length;) {
        const cp = s.codePointAt(i);
        const len = cp > 0xffff ? 2 : 1;
        const ch = s.substr(i, len);
        range.setStart(node, i);
        range.setEnd(node, i + len);
        const rects = range.getClientRects();
        if (rects.length && (rects[0].width > 0 || rects[0].height > 0)) {
          const r = rects[0];
          if (!cur || Math.abs(r.top - cur.top) > r.height * 0.5) {
            cur = { top: r.top, bottom: r.bottom, left: r.left, text: ch };
            lines.push(cur);
          } else {
            cur.text += ch;
            cur.bottom = Math.max(cur.bottom, r.bottom);
            cur.left = Math.min(cur.left, r.left);
          }
        } else if (cur) {
          cur.text += ch;
        }
        i += len;
      }
      return lines;
    }

    function drawTextCard(ctx, card, br, x, y, w, h) {
      const span = card.querySelector('.txt');
      const cs = getComputedStyle(span);
      const ccs = getComputedStyle(card);

      ctx.save();
      roundRect(ctx, x, y, w, h, 6);
      ctx.fillStyle = ccs.backgroundColor;
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = cs.color;
      ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      getTextLines(span).forEach(ln => {
        const t = ln.text.replace(/\s+$/, '');
        if (t) ctx.fillText(t, ln.left - br.left, (ln.top + ln.bottom) / 2 - br.top);
      });
      ctx.restore();
    }

    function drawCard(ctx, card, br, pxScale) {
      const r = card.getBoundingClientRect();
      const x = r.left - br.left, y = r.top - br.top, w = r.width, h = r.height;

      if (card.dataset.kind === 'text') {
        drawTextCard(ctx, card, br, x, y, w, h);
      } else {
        const img = card.querySelector('img');
        ctx.save();
        roundRect(ctx, x, y, w, h, 6);
        ctx.fillStyle = '#000';
        ctx.fill();
        ctx.clip();
        if (img && img.naturalWidth) {
          const ix = x + 1, iy = y + 1, iw = w - 2, ih = h - 2;
          const s = Math.min(iw / img.naturalWidth, ih / img.naturalHeight);
          const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
          const src = prescale(img, dw * pxScale, dh * pxScale);
          ctx.drawImage(src, ix + (iw - dw) / 2, iy + (ih - dh) / 2, dw, dh);
        }
        ctx.restore();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 5.5);
      ctx.stroke();
    }

    async function renderBoardCanvas() {
      const board = document.getElementById('tier-board');

      await Promise.all(Array.from(board.querySelectorAll('img')).map(i =>
        i.decode ? i.decode().catch(() => {}) : Promise.resolve()
      ));

      const br = board.getBoundingClientRect();
      const W = br.width, H = br.height;

      // 최대 6배 (카드 1칸 ≈ 400px). 보드가 크면 iOS 캔버스 면적 제한에 맞춰 자동 조절
      const MAX_SCALE = 6;
      const MAX_AREA = 16000000;
      const scale = Math.min(MAX_SCALE, Math.sqrt(MAX_AREA / (W * H)));

      const canvas = document.createElement('canvas');
      canvas.width = Math.round(W * scale);
      canvas.height = Math.round(H * scale);
      const pxScale = canvas.width / W;

      const ctx = canvas.getContext('2d');
      ctx.scale(pxScale, canvas.height / H);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      const rel = el => {
        const r = el.getBoundingClientRect();
        return { x: r.left - br.left, y: r.top - br.top, w: r.width, h: r.height };
      };

      ctx.save();
      roundRect(ctx, 0, 0, W, H, 10);
      ctx.clip();
      ctx.fillStyle = '#0d0e10';
      ctx.fillRect(0, 0, W, H);

      for (const row of board.querySelectorAll('.tier-row')) {
        const rr = rel(row);
        ctx.fillStyle = '#181a1f';
        ctx.fillRect(rr.x, rr.y, rr.w, rr.h);

        const label = row.querySelector('.tier-label');
        const lr = rel(label);
        const lcs = getComputedStyle(label);
        ctx.fillStyle = lcs.backgroundColor;
        ctx.fillRect(lr.x, lr.y, lr.w, lr.h);
        ctx.fillStyle = '#000';
        ctx.font = '900 ' + lcs.fontSize + ' ' + lcs.fontFamily;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label.textContent.trim(), lr.x + lr.w / 2, lr.y + lr.h / 2 + 1);

        const items = row.querySelector('.tier-items');
        const ir = rel(items);
        ctx.fillStyle = '#141518';
        ctx.fillRect(ir.x, ir.y, ir.w, ir.h);

        items.querySelectorAll('.item-card').forEach(card => drawCard(ctx, card, br, pxScale));
      }
      ctx.restore();

      ctx.strokeStyle = '#2e323b';
      ctx.lineWidth = 1;
      roundRect(ctx, 0.5, 0.5, W - 1, H - 1, 9.5);
      ctx.stroke();

      return canvas;
    }

    function showPreview(blob) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      document.getElementById('preview-img').src = previewUrl;
      document.getElementById('preview-modal').classList.add('active');
    }

    async function saveAsImage() {
      const btn = document.getElementById('download-btn');
      if (btn.disabled) return;

      if (!document.querySelector('#tier-board .item-card')) {
        toast('티어에 배치된 항목이 없어요.');
        return;
      }

      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ 처리 중...';
      btn.disabled = true;

      try {
        const canvas = await renderBoardCanvas();
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        if (!blob) throw new Error('이미지 생성 실패');

        const fileName = 'tierlist-' + todayStr() + '.png';
        const file = new File([blob], fileName, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: '완성된 티어표' });
          } catch (err) {
            // 사용자가 직접 닫은 경우(AbortError)는 무시, 그 외엔 길게 눌러 저장하는 화면 제공
            if (!err || err.name !== 'AbortError') showPreview(blob);
          }
        } else {
          downloadBlob(blob, fileName);
        }
      } catch (err) {
        console.error(err);
        toast('이미지 저장 중 오류가 발생했어요.');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    updateCounts();
  </script>
</body>
</html>
