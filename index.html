<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티어표 메이커 (Tier List Maker)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#12131C',
                        darkcard: '#1A1C29',
                        darkaccent: '#26293D',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #12131C;
        }
        ::-webkit-scrollbar-thumb {
            background: #2D3148;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B405E;
        }

        .drag-over {
            outline: 2px dashed #6366f1;
            background-color: rgba(99, 102, 241, 0.15) !important;
        }

        /* Touch dragging styles */
        .touch-dragging {
            opacity: 0.7;
            position: fixed !important;
            pointer-events: none;
            z-index: 9999;
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .tier-row {
            min-height: 80px;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-darkcard border-b border-slate-800 py-4 px-4 sm:px-8 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center font-black text-xl shadow-lg">
                    T
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                        나만의 티어표 메이커
                    </h1>
                    <p class="text-xs text-slate-400">자유롭게 분류하고 이미지로 저장하세요</p>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex flex-wrap items-center gap-2">
                <button id="exportJsonBtn" class="px-3 py-2 bg-darkaccent hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-medium rounded-lg transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-file-export"></i> 데이터 저장
                </button>
                <button id="importJsonBtn" class="px-3 py-2 bg-darkaccent hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-medium rounded-lg transition flex items-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-file-import"></i> 데이터 불러오기
                </button>
                <input type="file" id="jsonFileInput" accept=".json" class="hidden">

                <button id="shareBtn" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium rounded-lg transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-share-nodes"></i> 공유
                </button>
                <button id="downloadBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-semibold rounded-lg transition flex items-center gap-2 shadow-lg shadow-emerald-900/30">
                    <i class="fa-solid fa-download"></i> 이미지 다운로드
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full flex-1 p-4 sm:p-6 space-y-6">

        <!-- Controls Toolbar -->
        <div class="bg-darkcard border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col md:flex-row justify-between gap-4 items-center">
            
            <!-- Item Adding Controls -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <!-- Batch Image Upload -->
                <label class="cursor-pointer px-4 py-2.5 bg-indigo-600/20 border border-indigo-500/40 hover:bg-indigo-600/30 text-indigo-300 font-medium rounded-xl transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-images text-indigo-400"></i>
                    <span>이미지 선택 (여러 개 가능)</span>
                    <input type="file" id="imageUpload" multiple accept="image/*" class="hidden">
                </label>

                <!-- Custom Text Card Add -->
                <div class="flex items-center gap-2 flex-1 sm:flex-initial">
                    <input type="text" id="textCardInput" placeholder="카드 이름..." class="bg-darkbg border border-slate-700 text-sm rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 w-32 sm:w-44">
                    <button id="addTextCardBtn" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-xl transition flex items-center gap-1 font-medium whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> 텍스트 카드
                    </button>
                </div>
            </div>

            <!-- Tier Control & Clear Buttons -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <button id="addTierBtn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs sm:text-sm font-medium rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-amber-400"></i> 새 티어 추가
                </button>
                <button id="resetBtn" class="px-3 py-2 bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 text-xs sm:text-sm font-medium rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> 전체 초기화
                </button>
            </div>
        </div>

        <!-- Tier List Canvas Container (Captured by html2canvas) -->
        <div id="tierboard" class="bg-darkbg p-3 sm:p-4 rounded-2xl border border-slate-800/80 shadow-2xl space-y-2">
            <!-- Tier Rows will be dynamically rendered here -->
        </div>

        <!-- Unranked Items Pool Container -->
        <div class="bg-darkcard border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-slate-200 text-base flex items-center gap-2">
                        <i class="fa-solid fa-box-archive text-indigo-400"></i> 미분류 아이템
                    </h2>
                    <span id="unrankedCount" class="bg-slate-800 text-slate-400 text-xs px-2 py-0.5 rounded-full font-mono">0</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="clearUnrankedBtn" class="text-xs text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> 보관함 비우기
                    </button>
                </div>
            </div>

            <!-- Drop target for unranked items & Direct File Drop -->
            <div id="unrankedPool" class="min-h-[140px] p-3 rounded-xl bg-darkbg border-2 border-dashed border-slate-800 flex flex-wrap gap-2.5 items-start justify-start transition-colors relative">
                <!-- Dropzone Placeholder Text -->
                <div id="poolPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 pointer-events-none p-4 text-center">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl mb-1 text-slate-600"></i>
                    <p class="text-xs">이곳에 이미지 파일들을 직접 드래그 앤 드롭하여 추가할 수 있습니다.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-500 text-xs border-t border-slate-800/60 mt-auto">
        <p>Tier List Generator &copy; 2026. 드래그 앤 드롭 또는 클릭하여 아이템을 티어로 이동하세요.</p>
    </footer>

    <!-- Edit Tier Modal -->
    <div id="tierModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-darkcard border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-400"></i> 티어 설정 수정
            </h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">티어 이름</label>
                    <input type="text" id="modalTierTitle" class="w-full bg-darkbg border border-slate-700 text-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">배경 색상</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="modalTierColor" class="w-12 h-10 rounded-lg cursor-pointer bg-transparent border-0">
                        <input type="text" id="modalTierColorHex" class="flex-1 bg-darkbg border border-slate-700 text-slate-200 rounded-xl px-3 py-2 text-sm font-mono uppercase" placeholder="#FF7F7F">
                    </div>
                </div>

                <!-- Preset Colors -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">프리셋 색상</label>
                    <div class="flex flex-wrap gap-2" id="presetColorsContainer">
                        <!-- Presets generated in JS -->
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button id="closeModalBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition">취소</button>
                <button id="saveModalBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition">저장</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-indigo-600 text-white text-sm px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">알림 메세지</span>
    </div>

    <!-- Item Selection/Move Modal for Mobile/Click Accessibility -->
    <div id="moveModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-darkcard border border-slate-700 rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-slate-100 border-b border-slate-800 pb-2">아이템 이동</h3>
            <p class="text-xs text-slate-400">이동할 티어를 선택하세요:</p>
            <div id="moveTargets" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Move target buttons rendered here -->
            </div>
            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button id="closeMoveModalBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium">닫기</button>
            </div>
        </div>
    </div>

    <!-- Main Application JavaScript -->
    <script>
        // Predefined Default Tiers Data
        const DEFAULT_TIERS = [
            { id: 'tier-s', title: 'S', color: '#ff7f7f' },
            { id: 'tier-a', title: 'A', color: '#ffbf7f' },
            { id: 'tier-b', title: 'B', color: '#ffff7f' },
            { id: 'tier-c', title: 'C', color: '#7fff7f' },
            { id: 'tier-d', title: 'D', color: '#7fbfff' },
            { id: 'tier-f', title: 'F', color: '#ff7fff' }
        ];

        // Preset Color Palette for Quick Selection
        const PRESET_COLORS = [
            '#ff7f7f', '#ffbf7f', '#ffff7f', '#7fff7f', 
            '#7fbfff', '#7f7fff', '#ff7fff', '#bf7fff',
            '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#64748b'
        ];

        // App State
        let tiers = JSON.parse(localStorage.getItem('tierlist_tiers')) || DEFAULT_TIERS;
        let items = JSON.parse(localStorage.getItem('tierlist_items')) || [];
        
        let editingTierId = null;
        let selectedItemIdForMove = null;
        let draggedElement = null;

        // DOM Elements
        const tierboard = document.getElementById('tierboard');
        const unrankedPool = document.getElementById('unrankedPool');
        const poolPlaceholder = document.getElementById('poolPlaceholder');
        const unrankedCount = document.getElementById('unrankedCount');
        const imageUpload = document.getElementById('imageUpload');
        const textCardInput = document.getElementById('textCardInput');
        const addTextCardBtn = document.getElementById('addTextCardBtn');
        const addTierBtn = document.getElementById('addTierBtn');
        const resetBtn = document.getElementById('resetBtn');
        const clearUnrankedBtn = document.getElementById('clearUnrankedBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const importJsonBtn = document.getElementById('importJsonBtn');
        const jsonFileInput = document.getElementById('jsonFileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');

        // Modal Elements
        const tierModal = document.getElementById('tierModal');
        const modalTierTitle = document.getElementById('modalTierTitle');
        const modalTierColor = document.getElementById('modalTierColor');
        const modalTierColorHex = document.getElementById('modalTierColorHex');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const saveModalBtn = document.getElementById('saveModalBtn');
        const presetColorsContainer = document.getElementById('presetColorsContainer');

        const moveModal = document.getElementById('moveModal');
        const moveTargets = document.getElementById('moveTargets');
        const closeMoveModalBtn = document.getElementById('closeMoveModalBtn');

        // Initialize App
        function init() {
            renderPresetColors();
            renderTiers();
            renderItems();
            setupEventListeners();
        }

        // Save State to Local Storage
        function saveState() {
            try {
                localStorage.setItem('tierlist_tiers', JSON.stringify(tiers));
                localStorage.setItem('tierlist_items', JSON.stringify(items));
            } catch (e) {
                console.warn('LocalStorage 저장 용량 초과일 수 있습니다.', e);
            }
            updateUnrankedCount();
        }

        // Render Preset Color Palette in Modal
        function renderPresetColors() {
            presetColorsContainer.innerHTML = '';
            PRESET_COLORS.forEach(color => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-7 h-7 rounded-full border border-slate-600 hover:scale-110 transition shadow';
                btn.style.backgroundColor = color;
                btn.addEventListener('click', () => {
                    modalTierColor.value = color;
                    modalTierColorHex.value = color.toUpperCase();
                });
                presetColorsContainer.appendChild(btn);
            });
        }

        // Render Tier Rows
        function renderTiers() {
            tierboard.innerHTML = '';
            tiers.forEach((tier, index) => {
                const tierRow = document.createElement('div');
                tierRow.className = 'tier-row flex flex-col sm:flex-row bg-darkcard border border-slate-800 rounded-xl overflow-hidden group shadow-md transition';
                tierRow.dataset.tierId = tier.id;

                // Tier Label Box
                const labelBox = document.createElement('div');
                labelBox.className = 'w-full sm:w-28 md:w-36 flex-shrink-0 p-3 flex sm:flex-col items-center justify-between sm:justify-center text-center font-black text-xl sm:text-2xl select-none relative group/label';
                labelBox.style.backgroundColor = tier.color;
                
                const textColor = getContrastColor(tier.color);
                labelBox.style.color = textColor;

                // Title Text
                const titleSpan = document.createElement('span');
                titleSpan.className = 'break-all font-extrabold tracking-wider px-1';
                titleSpan.textContent = tier.title;

                // Action Controls inside Tier Label (Edit, Reorder, Delete)
                const controls = document.createElement('div');
                controls.className = 'flex items-center gap-1 opacity-90 sm:opacity-0 group-hover/label:opacity-100 sm:mt-2 transition-opacity bg-black/30 p-1 rounded-lg backdrop-blur-xs text-xs';
                controls.style.color = '#ffffff';

                controls.innerHTML = `
                    <button class="edit-tier-btn p-1 hover:text-amber-300 transition" title="티어 수정"><i class="fa-solid fa-pen"></i></button>
                    <button class="up-tier-btn p-1 hover:text-indigo-300 transition ${index === 0 ? 'opacity-30 cursor-not-allowed' : ''}" title="위로 이동"><i class="fa-solid fa-arrow-up"></i></button>
                    <button class="down-tier-btn p-1 hover:text-indigo-300 transition ${index === tiers.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}" title="아래로 이동"><i class="fa-solid fa-arrow-down"></i></button>
                    <button class="delete-tier-btn p-1 hover:text-rose-300 transition" title="티어 삭제"><i class="fa-solid fa-trash"></i></button>
                `;

                labelBox.appendChild(titleSpan);
                labelBox.appendChild(controls);

                // Tier Items Container (Drop Target)
                const itemsContainer = document.createElement('div');
                itemsContainer.className = 'tier-items-container flex-1 p-2 bg-darkbg/50 min-h-[80px] flex flex-wrap gap-2 items-center transition-colors';
                itemsContainer.dataset.tierId = tier.id;

                // Event Listeners for Tier Label Controls
                controls.querySelector('.edit-tier-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openTierModal(tier.id);
                });

                controls.querySelector('.up-tier-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (index > 0) {
                        const temp = tiers[index];
                        tiers[index] = tiers[index - 1];
                        tiers[index - 1] = temp;
                        saveState();
                        renderTiers();
                        renderItems();
                    }
                });

                controls.querySelector('.down-tier-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (index < tiers.length - 1) {
                        const temp = tiers[index];
                        tiers[index] = tiers[index + 1];
                        tiers[index + 1] = temp;
                        saveState();
                        renderTiers();
                        renderItems();
                    }
                });

                controls.querySelector('.delete-tier-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`'${tier.title}' 티어를 삭제하시겠습니까? 안의 아이템은 미분류로 이동합니다.`)) {
                        items.forEach(item => {
                            if (item.tierId === tier.id) {
                                item.tierId = 'unranked';
                            }
                        });
                        tiers = tiers.filter(t => t.id !== tier.id);
                        saveState();
                        renderTiers();
                        renderItems();
                    }
                });

                setupDropTarget(itemsContainer);

                tierRow.appendChild(labelBox);
                tierRow.appendChild(itemsContainer);
                tierboard.appendChild(tierRow);
            });

            setupDropTarget(unrankedPool);
        }

        // Render Items inside their respective Tiers or Unranked Pool
        function renderItems() {
            document.querySelectorAll('.tier-items-container').forEach(c => c.innerHTML = '');
            unrankedPool.innerHTML = '';
            unrankedPool.appendChild(poolPlaceholder);

            const unrankedItems = items.filter(i => i.tierId === 'unranked' || !i.tierId);
            if (unrankedItems.length > 0) {
                poolPlaceholder.classList.add('hidden');
            } else {
                poolPlaceholder.classList.remove('hidden');
            }

            items.forEach(item => {
                const itemEl = createItemElement(item);

                if (item.tierId === 'unranked' || !item.tierId) {
                    unrankedPool.appendChild(itemEl);
                } else {
                    const targetContainer = document.querySelector(`.tier-items-container[data-tier-id="${item.tierId}"]`);
                    if (targetContainer) {
                        targetContainer.appendChild(itemEl);
                    } else {
                        item.tierId = 'unranked';
                        unrankedPool.appendChild(itemEl);
                    }
                }
            });

            updateUnrankedCount();
        }

        // Create Individual Item Element DOM
        function createItemElement(item) {
            const div = document.createElement('div');
            div.className = 'item-card relative w-16 h-16 sm:w-20 sm:h-20 rounded-xl overflow-hidden shadow-md cursor-grab active:cursor-grabbing border border-slate-700 bg-darkcard flex items-center justify-center select-none group transition transform hover:scale-105 hover:z-10';
            div.draggable = true;
            div.dataset.id = item.id;

            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.content;
                img.alt = 'Item Image';
                img.className = 'w-full h-full object-cover pointer-events-none';
                img.onerror = () => {
                    div.innerHTML = '<span class="text-[10px] text-rose-400 p-1">이미지 오류</span>';
                };
                div.appendChild(img);
            } else {
                div.style.backgroundColor = item.bgColor || '#334155';
                const span = document.createElement('span');
                span.className = 'p-1.5 text-center text-xs font-bold break-words line-clamp-3 select-none';
                span.style.color = getContrastColor(item.bgColor || '#334155');
                span.textContent = item.content;
                div.appendChild(span);
            }

            const delBtn = document.createElement('button');
            delBtn.className = 'absolute top-0.5 right-0.5 bg-rose-600/90 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition shadow hover:bg-rose-500 z-20';
            delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            delBtn.title = '아이템 삭제';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteItem(item.id);
            });
            div.appendChild(delBtn);

            div.addEventListener('dragstart', handleDragStart);
            div.addEventListener('dragend', handleDragEnd);

            setupTouchAndClickSupport(div, item);

            return div;
        }

        // HTML5 Drag and Drop Handlers
        function handleDragStart(e) {
            draggedElement = this;
            e.dataTransfer.setData('text/plain', this.dataset.id);
            e.dataTransfer.effectAllowed = 'move';
            this.classList.add('opacity-40');
        }

        function handleDragEnd(e) {
            this.classList.remove('opacity-40');
            draggedElement = null;
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        }

        function setupDropTarget(targetEl) {
            targetEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                targetEl.classList.add('drag-over');
            });

            targetEl.addEventListener('dragleave', (e) => {
                targetEl.classList.remove('drag-over');
            });

            targetEl.addEventListener('drop', (e) => {
                e.preventDefault();
                targetEl.classList.remove('drag-over');

                // Handle direct external image files drop
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processUploadedFiles(Array.from(e.dataTransfer.files));
                    return;
                }

                const itemId = e.dataTransfer.getData('text/plain');
                if (!itemId) return;

                const targetTierId = targetEl.dataset.tierId || 'unranked';
                moveItemToTier(itemId, targetTierId);
            });
        }

        // Batch File Processing Function
        function processUploadedFiles(files) {
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            if (imageFiles.length === 0) {
                showToast('이미지 파일만 업로드할 수 있습니다.');
                return;
            }

            showToast(`${imageFiles.length}개의 이미지 읽는 중...`);
            let processed = 0;

            imageFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    items.push({
                        id: 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        type: 'image',
                        content: event.target.result,
                        tierId: 'unranked'
                    });

                    processed++;
                    if (processed === imageFiles.length) {
                        saveState();
                        renderItems();
                        showToast(`${imageFiles.length}개의 이미지가 보관함에 추가되었습니다.`);
                        imageUpload.value = '';
                    }
                };
                reader.onerror = function() {
                    showToast('파일을 읽는 도중 오류가 발생했습니다.');
                };
                reader.readAsDataURL(file);
            });
        }

        // Move Item Logic
        function moveItemToTier(itemId, targetTierId) {
            const item = items.find(i => i.id === itemId);
            if (item) {
                item.tierId = targetTierId;
                saveState();
                renderItems();
            }
        }

        // Mobile Touch & Click Menu Handlers
        function setupTouchAndClickSupport(element, item) {
            let touchStartX, touchStartY;
            let clone = null;

            element.addEventListener('click', (e) => {
                if (e.target.closest('button')) return;
                openMoveModal(item.id);
            });

            element.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: true });

            element.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const deltaX = Math.abs(touch.clientX - touchStartX);
                const deltaY = Math.abs(touch.clientY - touchStartY);

                if (deltaX > 10 || deltaY > 10) {
                    if (!clone) {
                        clone = element.cloneNode(true);
                        clone.classList.add('touch-dragging');
                        document.body.appendChild(clone);
                        element.classList.add('opacity-30');
                    }
                }

                if (clone) {
                    e.preventDefault();
                    clone.style.left = `${touch.clientX - 35}px`;
                    clone.style.top = `${touch.clientY - 35}px`;
                }
            }, { passive: false });

            element.addEventListener('touchend', (e) => {
                if (clone) {
                    const touch = e.changedTouches[0];
                    clone.remove();
                    clone = null;
                    element.classList.remove('opacity-30');

                    const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (dropTarget) {
                        const container = dropTarget.closest('.tier-items-container, #unrankedPool');
                        if (container) {
                            const targetTierId = container.dataset.tierId || 'unranked';
                            moveItemToTier(item.id, targetTierId);
                        }
                    }
                }
            });
        }

        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveState();
            renderItems();
        }

        function updateUnrankedCount() {
            const count = items.filter(i => i.tierId === 'unranked' || !i.tierId).length;
            unrankedCount.textContent = count;
        }

        function openTierModal(tierId) {
            editingTierId = tierId;
            const tier = tiers.find(t => t.id === tierId);
            if (!tier) return;

            modalTierTitle.value = tier.title;
            modalTierColor.value = tier.color;
            modalTierColorHex.value = tier.color.toUpperCase();

            tierModal.classList.remove('hidden');
        }

        function closeTierModal() {
            tierModal.classList.add('hidden');
            editingTierId = null;
        }

        function openMoveModal(itemId) {
            selectedItemIdForMove = itemId;
            moveTargets.innerHTML = '';

            const unrankedOption = document.createElement('button');
            unrankedOption.className = 'w-full text-left px-3 py-2 bg-darkbg hover:bg-slate-800 rounded-xl text-xs text-slate-300 font-semibold flex items-center gap-2 border border-slate-700 transition';
            unrankedOption.innerHTML = `<i class="fa-solid fa-box-archive text-indigo-400"></i> 미분류 보관함으로 이동`;
            unrankedOption.addEventListener('click', () => {
                moveItemToTier(selectedItemIdForMove, 'unranked');
                moveModal.classList.add('hidden');
            });
            moveTargets.appendChild(unrankedOption);

            tiers.forEach(tier => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between border border-slate-700/60 transition';
                btn.style.backgroundColor = tier.color;
                btn.style.color = getContrastColor(tier.color);
                btn.innerHTML = `<span>${tier.title} 티어로 이동</span> <i class="fa-solid fa-chevron-right text-xs"></i>`;
                
                btn.addEventListener('click', () => {
                    moveItemToTier(selectedItemIdForMove, tier.id);
                    moveModal.classList.add('hidden');
                });
                moveTargets.appendChild(btn);
            });

            moveModal.classList.remove('hidden');
        }

        function handleImageUpload(e) {
            if (e.target.files && e.target.files.length > 0) {
                processUploadedFiles(Array.from(e.target.files));
            }
        }

        function handleAddTextCard() {
            const text = textCardInput.value.trim();
            if (!text) {
                showToast('카드 이름을 입력해주세요.');
                return;
            }

            const randomColor = PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)];

            items.push({
                id: 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                type: 'text',
                content: text,
                bgColor: randomColor,
                tierId: 'unranked'
            });

            textCardInput.value = '';
            saveState();
            renderItems();
            showToast('텍스트 카드가 추가되었습니다.');
        }

        function handleAddTier() {
            const newId = 'tier_' + Date.now();
            const randomColor = PRESET_COLORS[tiers.length % PRESET_COLORS.length];

            tiers.push({
                id: newId,
                title: 'NEW',
                color: randomColor
            });

            saveState();
            renderTiers();
            renderItems();
            showToast('새 티어가 추가되었습니다.');
        }

        function exportToJson() {
            const data = {
                tiers: tiers,
                items: items,
                exportedAt: new Date().toISOString()
            };
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `tier_list_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);

            showToast('티어표 데이터가 파일로 내보내졌습니다.');
        }

        function importFromJson(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.tiers && Array.isArray(data.tiers) && data.items && Array.isArray(data.items)) {
                        tiers = data.tiers;
                        items = data.items;
                        saveState();
                        renderTiers();
                        renderItems();
                        showToast('성공적으로 불러왔습니다.');
                    } else {
                        showToast('올바르지 않은 티어표 파일 형식입니다.');
                    }
                } catch (err) {
                    showToast('파일을 읽는 중 오류가 발생했습니다.');
                }
                jsonFileInput.value = '';
            };
            reader.readAsText(file);
        }

        function downloadImage() {
            showToast('이미지 생성 중... 잠시만 기다려주세요.');

            document.querySelectorAll('.group\\/label > div').forEach(el => el.style.display = 'none');

            html2canvas(tierboard, {
                backgroundColor: '#12131C',
                scale: 2,
                useCORS: true,
                logging: false
            }).then(canvas => {
                document.querySelectorAll('.group\\/label > div').forEach(el => el.style.display = '');

                const link = document.createElement('a');
                link.download = `tier_list_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                showToast('이미지가 다운로드 되었습니다!');
            }).catch(err => {
                document.querySelectorAll('.group\\/label > div').forEach(el => el.style.display = '');
                showToast('이미지 생성 실패. 다시 시도해 주세요.');
                console.error(err);
            });
        }

        function shareTierList() {
            if (navigator.share) {
                navigator.share({
                    title: '나만의 티어표',
                    text: '내가 만든 티어표를 확인해보세요!',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = window.location.href;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                showToast('페이지 링크가 클립보드에 복사되었습니다.');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function getContrastColor(hexColor) {
            if (!hexColor || hexColor[0] !== '#') return '#ffffff';
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 140) ? '#1e293b' : '#ffffff';
        }

        function setupEventListeners() {
            imageUpload.addEventListener('change', handleImageUpload);
            addTextCardBtn.addEventListener('click', handleAddTextCard);
            textCardInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddTextCard();
            });

            addTierBtn.addEventListener('click', handleAddTier);

            resetBtn.addEventListener('click', () => {
                if (confirm('모든 데이터(티어 및 아이템)를 기본값으로 초기화하시겠습니까?')) {
                    tiers = DEFAULT_TIERS;
                    items = [];
                    saveState();
                    renderTiers();
                    renderItems();
                    showToast('초기화되었습니다.');
                }
            });

            clearUnrankedBtn.addEventListener('click', () => {
                if (confirm('보관함의 미분류 아이템을 모두 삭제하시겠습니까?')) {
                    items = items.filter(i => i.tierId !== 'unranked' && i.tierId);
                    saveState();
                    renderItems();
                    showToast('미분류 아이템이 삭제되었습니다.');
                }
            });

            exportJsonBtn.addEventListener('click', exportToJson);
            importJsonBtn.addEventListener('click', () => jsonFileInput.click());
            jsonFileInput.addEventListener('change', importFromJson);
            downloadBtn.addEventListener('click', downloadImage);
            shareBtn.addEventListener('click', shareTierList);

            closeModalBtn.addEventListener('click', closeTierModal);
            saveModalBtn.addEventListener('click', () => {
                if (!editingTierId) return;
                const tier = tiers.find(t => t.id === editingTierId);
                if (tier) {
                    tier.title = modalTierTitle.value.trim() || 'TIER';
                    tier.color = modalTierColor.value;
                    saveState();
                    renderTiers();
                    renderItems();
                    closeTierModal();
                    showToast('티어가 수정되었습니다.');
                }
            });

            modalTierColor.addEventListener('input', (e) => {
                modalTierColorHex.value = e.target.value.toUpperCase();
            });

            modalTierColorHex.addEventListener('input', (e) => {
                if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                    modalTierColor.value = e.target.value;
                }
            });

            closeMoveModalBtn.addEventListener('click', () => moveModal.classList.add('hidden'));
        }

        window.onload = init;
    </script>
</body>
</html>
