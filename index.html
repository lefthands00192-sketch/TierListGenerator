<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>티어표 생성기 Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #121316;
      --panel: #1e2025;
      --border: #2e323b;
      --text: #f0f2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 900px; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 12px; font-weight: 800; }

    /* Controls */
    .toolbar {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: #2b2e36;
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; border-color: #60a5fa; }
    #file-input { display: none; }

    /* Tier Table */
    #tier-board {
      background: #0d0e10;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .tier-row { display: flex; min-height: 80px; background: #181a1f; }
    .tier-label {
      width: 75px;
      min-width: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.4rem;
      color: #000;
      text-align: center;
    }

    .tier-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: #141518;
      min-height: 80px;
      align-content: flex-start;
    }

    /* Item Card (원형/정사각형 비율 완전 고정) */
    .item-card {
      width: 68px;
      height: 68px;
      min-width: 68px;
      min-height: 68px;
      max-width: 68px;
      max-height: 68px;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      position: relative;
      border: 1px solid rgba(255,255,255,0.15);
      touch-action: none;
      display: block;
      flex-shrink: 0;
    }

    .item-card img {
      width: 68px;
      height: 68px;
      display: block;
      pointer-events: none;
    }

    /* 드래그 중 이동 효과 */
    .item-card.dragging {
      opacity: 0.8;
      position: fixed;
      z-index: 10000;
      pointer-events: none;
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }

    /* Unranked Pool */
    #unranked-section {
      margin-top: 16px;
      background: var(--panel);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    #unranked-section h3 { font-size: 0.9rem; margin-bottom: 8px; color: #9ca3af; }
    #unranked-pool {
      min-height: 90px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: #121316;
      border-radius: 8px;
      border: 2px dashed #2e323b;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #23262d;
      padding: 18px;
      border-radius: 14px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      border: 1px solid #3f4452;
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .t-btn {
      padding: 12px 0;
      border: none;
      border-radius: 6px;
      font-weight: 900;
      font-size: 1.1rem;
      color: #000;
      cursor: pointer;
    }

    .preview-img-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .preview-img {
      max-width: 100%;
      max-height: 60vh;
      display: block;
      border-radius: 6px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 티어표 생성기 Pro</h1>

    <div class="toolbar">
      <label class="btn btn-primary" for="file-input">📷 이미지 업로드</label>
      <input type="file" id="file-input" multiple accept="image/*">
      <button class="btn" onclick="saveAsImage()">💾 이미지 저장</button>
    </div>

    <!-- Tier Board -->
    <div id="tier-board">
      <div class="tier-row"><div class="tier-label" style="background: #ff7f7f;">S</div><div class="tier-items" id="tier-S"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #ffbf7f;">A</div><div class="tier-items" id="tier-A"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #ffff7f;">B</div><div class="tier-items" id="tier-B"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #7fff7f;">C</div><div class="tier-items" id="tier-C"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #7fbfff;">D</div><div class="tier-items" id="tier-D"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #bf7fff;">F</div><div class="tier-items" id="tier-F"></div></div>
    </div>

    <!-- Unranked Pool -->
    <div id="unranked-section">
      <h3>📦 미분류 보관함 (즉시 드래그 또는 터치하여 이동)</h3>
      <div id="unranked-pool" class="tier-items"></div>
    </div>
  </div>

  <!-- Quick Move Modal -->
  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <h3>배치할 등급 선택</h3>
      <div class="tier-grid">
        <button class="t-btn" style="background:#ff7f7f;" onclick="moveTo('S')">S</button>
        <button class="t-btn" style="background:#ffbf7f;" onclick="moveTo('A')">A</button>
        <button class="t-btn" style="background:#ffff7f;" onclick="moveTo('B')">B</button>
        <button class="t-btn" style="background:#7fff7f;" onclick="moveTo('C')">C</button>
        <button class="t-btn" style="background:#7fbfff;" onclick="moveTo('D')">D</button>
        <button class="t-btn" style="background:#bf7fff;" onclick="moveTo('F')">F</button>
      </div>
      <button class="btn" style="width:100%; background:#333;" onclick="moveTo('unranked')">미분류로 이동</button>
      <button class="btn" style="width:100%; margin-top:6px; background:#181818;" onclick="closeModal('move-modal')">취소</button>
    </div>
  </div>

  <!-- Image Save Modal -->
  <div class="modal-overlay" id="img-modal">
    <div class="modal-box">
      <h3>완성된 티어표</h3>
      <p style="font-size:0.8rem; color:#aaa;">이미지를 길게 누르면 사진 앱/앨범에 저장됩니다.</p>
      <div class="preview-img-container">
        <img id="result-img" class="preview-img">
      </div>
      <button class="btn" style="width:100%;" onclick="closeModal('img-modal')">닫기</button>
    </div>
  </div>

  <script>
    let selectedItem = null;
    let activeCard = null;
    let isDragging = false;
    let startX = 0, startY = 0;

    // File Upload Handler (이미지 왜곡 완전 방지 보정)
    document.getElementById('file-input').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const imgObj = new Image();
          imgObj.src = evt.target.result;
          imgObj.onload = function() {
            // 정사각형 68x68 캔버스에 원본 비율 손실 없이 그리기
            const canvas = document.createElement('canvas');
            canvas.width = 68;
            canvas.height = 68;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 68, 68);

            const scale = Math.min(68 / imgObj.width, 68 / imgObj.height);
            const w = imgObj.width * scale;
            const h = imgObj.height * scale;
            const x = (68 - w) / 2;
            const y = (68 - h) / 2;

            ctx.drawImage(imgObj, x, y, w, h);

            const fixedDataUrl = canvas.toDataURL('image/png');

            const card = document.createElement('div');
            card.className = 'item-card';

            const img = document.createElement('img');
            img.src = fixedDataUrl;
            card.appendChild(img);

            attachTouchAndClickEvents(card);
            document.getElementById('unranked-pool').appendChild(card);
          };
        };
        reader.readAsDataURL(file);
      });
      this.value = '';
    });

    // 0초 반응 초고속 터치/드래그 이벤터
    function attachTouchAndClickEvents(card) {
      let moved = false;

      card.addEventListener('touchstart', function(e) {
        moved = false;
        activeCard = card;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
      }, { passive: false });

      card.addEventListener('touchmove', function(e) {
        if (!activeCard) return;
        const touch = e.touches[0];
        const deltaX = Math.abs(touch.clientX - startX);
        const deltaY = Math.abs(touch.clientY - startY);

        if (deltaX > 5 || deltaY > 5) {
          moved = true;
          isDragging = true;
          e.preventDefault(); // 스크롤 방지

          card.classList.add('dragging');
          card.style.left = (touch.clientX - 34) + 'px';
          card.style.top = (touch.clientY - 34) + 'px';
        }
      }, { passive: false });

      card.addEventListener('touchend', function(e) {
        if (!activeCard) return;

        if (isDragging) {
          card.classList.remove('dragging');
          card.style.left = '';
          card.style.top = '';

          const touch = e.changedTouches[0];
          const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);

          if (dropTarget) {
            const container = dropTarget.closest('.tier-items');
            if (container) {
              container.appendChild(card);
            }
          }
          isDragging = false;
        } else if (!moved) {
          // 클릭 시 이동 모달 열기
          selectedItem = card;
          document.getElementById('move-modal').classList.add('active');
        }
        activeCard = null;
      });
    }

    function moveTo(tier) {
      if (!selectedItem) return;
      if (tier === 'unranked') {
        document.getElementById('unranked-pool').appendChild(selectedItem);
      } else {
        document.getElementById('tier-' + tier).appendChild(selectedItem);
      }
      closeModal('move-modal');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      selectedItem = null;
    }

    // Export Canvas
    function saveAsImage() {
      const board = document.getElementById('tier-board');
      html2canvas(board, {
        backgroundColor: '#0d0e10',
        scale: 2,
        useCORS: true
      }).then(canvas => {
        const dataUrl = canvas.toDataURL('image/png');
        document.getElementById('result-img').src = dataUrl;
        document.getElementById('img-modal').classList.add('active');
      });
    }
  </script>
</body>
</html>
