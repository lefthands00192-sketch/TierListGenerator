<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>티어표 생성기 Pro</title>
  <!-- 기존 픽셀 깨짐의 원인이었던 html2canvas 삭제 및 최신 html-to-image 라이브러리로 교체 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <style>
    :root {
      --bg: #121316;
      --panel: #1e2025;
      --border: #2e323b;
      --text: #f0f2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container { width: 100%; max-width: 900px; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 12px; font-weight: 800; }

    /* Controls */
    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: #2b2e36;
      color: #fff;
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; border-color: #60a5fa; }
    .btn-success { background: #10b981; border-color: #34d399; }
    .btn-danger { background: #ef4444; border-color: #f87171; }
    #file-input, #backup-input { display: none; }

    /* Tier Table */
    #tier-board {
      background: #0d0e10;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .tier-row { display: flex; min-height: 80px; background: #181a1f; }
    .tier-label {
      width: 75px;
      min-width: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.4rem;
      color: #000;
      text-align: center;
    }

    .tier-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: #141518;
      min-height: 80px;
      align-content: flex-start;
    }

    /* 아이템 카드 고정 비율 및 이미지 렌더링 최적화 */
    .item-card {
      width: 68px !important;
      height: 68px !important;
      min-width: 68px !important;
      min-height: 68px !important;
      border-radius: 6px;
      background-color: #000;
      position: relative;
      border: 1px solid rgba(255,255,255,0.15);
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      image-rendering: -webkit-optimize-contrast; /* 사파리/iOS 화질 저하 방지 */
    }

    /* 드래그 효과 */
    .item-card.dragging {
      opacity: 0.85;
      position: fixed;
      z-index: 10000;
      pointer-events: none;
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }

    /* Unranked Pool */
    #unranked-section {
      margin-top: 16px;
      background: var(--panel);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    #unranked-section h3 { font-size: 0.9rem; margin-bottom: 8px; color: #9ca3af; }
    #unranked-pool {
      min-height: 90px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: #121316;
      border-radius: 8px;
      border: 2px dashed #2e323b;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #23262d;
      padding: 18px;
      border-radius: 14px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      border: 1px solid #3f4452;
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 1.1rem; }
    .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .t-btn {
      padding: 12px 0;
      border: none;
      border-radius: 6px;
      font-weight: 900;
      font-size: 1.1rem;
      color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 티어표 생성기 Pro</h1>

    <div class="toolbar">
      <label class="btn btn-primary" for="file-input">📷 이미지 업로드</label>
      <input type="file" id="file-input" multiple accept="image/*">
      
      <button class="btn btn-success" onclick="exportBackup()">💾 백업 저장</button>
      <label class="btn" for="backup-input">📂 백업 불러오기</label>
      <input type="file" id="backup-input" accept=".json">

      <button id="download-btn" class="btn" onclick="saveAsImage()">🖼️ 이미지 다운로드</button>
      <button class="btn btn-danger" onclick="clearData()">🔄 전체 초기화</button>
    </div>

    <!-- Tier Board -->
    <div id="tier-board">
      <div class="tier-row"><div class="tier-label" style="background: #ff7f7f;">S</div><div class="tier-items" id="tier-S" data-tier="S"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #ffbf7f;">A</div><div class="tier-items" id="tier-A" data-tier="A"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #ffff7f;">B</div><div class="tier-items" id="tier-B" data-tier="B"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #7fff7f;">C</div><div class="tier-items" id="tier-C" data-tier="C"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #7fbfff;">D</div><div class="tier-items" id="tier-D" data-tier="D"></div></div>
      <div class="tier-row"><div class="tier-label" style="background: #bf7fff;">F</div><div class="tier-items" id="tier-F" data-tier="F"></div></div>
    </div>

    <!-- Unranked Pool -->
    <div id="unranked-section">
      <h3>📦 미분류 보관함</h3>
      <div id="unranked-pool" class="tier-items" data-tier="unranked"></div>
    </div>
  </div>

  <!-- Quick Move Modal -->
  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <h3>배치할 등급 선택</h3>
      <div class="tier-grid">
        <button class="t-btn" style="background:#ff7f7f;" onclick="moveTo('S')">S</button>
        <button class="t-btn" style="background:#ffbf7f;" onclick="moveTo('A')">A</button>
        <button class="t-btn" style="background:#ffff7f;" onclick="moveTo('B')">B</button>
        <button class="t-btn" style="background:#7fff7f;" onclick="moveTo('C')">C</button>
        <button class="t-btn" style="background:#7fbfff;" onclick="moveTo('D')">D</button>
        <button class="t-btn" style="background:#bf7fff;" onclick="moveTo('F')">F</button>
      </div>
      <button class="btn" style="width:100%; background:#333;" onclick="moveTo('unranked')">미분류로 이동</button>
      <button class="btn" style="width:100%; margin-top:6px; background:#181818;" onclick="closeModal('move-modal')">취소</button>
    </div>
  </div>

  <script>
    let selectedItem = null;
    let activeCard = null;
    let isDragging = false;
    let startX = 0, startY = 0;

    window.addEventListener('DOMContentLoaded', () => {
      loadAutoSave();
    });

    document.getElementById('file-input').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          createItemCard(evt.target.result, 'unranked-pool');
          autoSave();
        };
        reader.readAsDataURL(file);
      });
      this.value = '';
    });

    function createItemCard(imgSrc, parentId) {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.setAttribute('data-src', imgSrc);

      const img = document.createElement('img');
      img.src = imgSrc;
      card.appendChild(img);

      attachTouchAndClickEvents(card);
      const parent = document.getElementById(parentId);
      if (parent) parent.appendChild(card);
      return card;
    }

    function attachTouchAndClickEvents(card) {
      let moved = false;

      card.addEventListener('touchstart', function(e) {
        moved = false;
        activeCard = card;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
      }, { passive: false });

      card.addEventListener('touchmove', function(e) {
        if (!activeCard) return;
        const touch = e.touches[0];
        const deltaX = Math.abs(touch.clientX - startX);
        const deltaY = Math.abs(touch.clientY - startY);

        if (deltaX > 5 || deltaY > 5) {
          moved = true;
          isDragging = true;
          e.preventDefault();

          card.classList.add('dragging');
          card.style.left = (touch.clientX - 34) + 'px';
          card.style.top = (touch.clientY - 34) + 'px';
        }
      }, { passive: false });

      card.addEventListener('touchend', function(e) {
        if (!activeCard) return;

        if (isDragging) {
          card.classList.remove('dragging');
          card.style.left = '';
          card.style.top = '';

          const touch = e.changedTouches[0];
          const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);

          if (dropTarget) {
            const container = dropTarget.closest('.tier-items');
            if (container) {
              container.appendChild(card);
              autoSave();
            }
          }
          isDragging = false;
        } else if (!moved) {
          selectedItem = card;
          document.getElementById('move-modal').classList.add('active');
        }
        activeCard = null;
      });
    }

    function moveTo(tier) {
      if (!selectedItem) return;
      if (tier === 'unranked') {
        document.getElementById('unranked-pool').appendChild(selectedItem);
      } else {
        document.getElementById('tier-' + tier).appendChild(selectedItem);
      }
      autoSave();
      closeModal('move-modal');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      selectedItem = null;
    }

    function autoSave() {
      const data = collectData();
      localStorage.setItem('tierlist_autosave', JSON.stringify(data));
    }

    function loadAutoSave() {
      const saved = localStorage.getItem('tierlist_autosave');
      if (saved) {
        try {
          restoreData(JSON.parse(saved));
        } catch(e) {}
      }
    }

    function collectData() {
      const items = [];
      document.querySelectorAll('.item-card').forEach(card => {
        const parent = card.parentElement;
        const tier = parent ? (parent.getAttribute('data-tier') || 'unranked') : 'unranked';
        const imgSrc = card.getAttribute('data-src');
        if (imgSrc) items.push({ tier, imgSrc });
      });
      return items;
    }

    function restoreData(data) {
      if (!Array.isArray(data)) return;
      document.querySelectorAll('.tier-items').forEach(el => el.innerHTML = '');
      data.forEach(item => {
        const targetId = item.tier === 'unranked' ? 'unranked-pool' : 'tier-' + item.tier;
        createItemCard(item.imgSrc, targetId);
      });
    }

    function exportBackup() {
      const data = collectData();
      if (data.length === 0) {
        alert('백업할 아이템이 없습니다.');
        return;
      }
      const jsonStr = JSON.stringify(data);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tierlist-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('backup-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        let parsedData = null;
        try {
          parsedData = JSON.parse(evt.target.result);
        } catch(err) {
          alert('올바른 백업 파일(.json)이 아닙니다.');
          return;
        }

        if (!Array.isArray(parsedData)) {
          alert('지원하지 않는 백업 데이터 형식입니다.');
          return;
        }

        try {
          restoreData(parsedData);
          autoSave();
        } catch(err) {
          console.error(err);
        }
      };
      reader.readAsText(file);
      this.value = '';
    });

    function clearData() {
      if (confirm('모든 내용과 저장된 데이터를 초기화하시겠습니까?')) {
        localStorage.removeItem('tierlist_autosave');
        document.querySelectorAll('.tier-items').forEach(el => el.innerHTML = '');
      }
    }

    // 🖼️ 완벽한 화질을 보장하는 html-to-image 엔진으로 변경 (직접 저장)
    function saveAsImage() {
      const board = document.getElementById('tier-board');
      const btn = document.getElementById('download-btn');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '⏳ 고화질 변환 중...';
      btn.disabled = true;

      // html-to-image 라이브러리: 픽셀 배율(4배)을 강제 적용해 선명도 극대화
      htmlToImage.toBlob(board, {
        pixelRatio: 4, 
        backgroundColor: '#0d0e10',
        style: { margin: '0' }
      }).then(function (blob) {
        if (!blob) throw new Error('Blob 생성 실패');

        const fileName = `tierlist-${new Date().toISOString().slice(0,10)}.png`;
        const file = new File([blob], fileName, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            files: [file],
            title: '완성된 티어표'
          }).finally(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          });
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      }).catch(function (error) {
        console.error('이미지 캡처 중 오류 발생:', error);
        alert('이미지 저장 중 오류가 발생했습니다.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
